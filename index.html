<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Sensor DHT11</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      margin-bottom: 20px;
      color: #555;
      font-size: 14px;
    }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }
    .timestamp {
      font-size: 12px;
      color: #777;
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 4px 0;
    }
    th {
      width: 45%;
      color: #555;
    }
    .status-ok {
      color: green;
      font-weight: bold;
    }
    .status-error {
      color: red;
      font-weight: bold;
    }
    .refresh-info {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Dashboard Sensor IoT</h1>
  <div class="subtitle">
    Greenhouse
  </div>

  <div class="grid" id="cards-container">
    <!-- Kartu node akan dibuat via JavaScript -->
  </div>

  <div class="refresh-info">
    Otomatis refresh setiap 30 detik.
  </div>

  <script>
    const SHEET_ID = '1M5ZpNznzEYGM0CnCxf3WTAYjaCkQiGA_TD-reMynzU8';
    const NODES = ['node1', 'node2', 'node3', 'node4'];

    // Mapping kolom (K4–S4) ke nama field
    const FIELD_NAMES = [
      'Tanggal',
      'Waktu',
      'Status Pembacaan',
      'Temperature (°C)',
      'Humidity (%)',
      'Tekanan Udara',
      'Intensitas Cahaya',
      'Kelembaban Tanah',
      'Status Pompa'
    ];

    function buildSheetUrl(sheetName) {
      // gviz JSON output
      return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}&range=K4:S4`;
    }

    async function fetchNodeData(sheetName) {
      const url = buildSheetUrl(sheetName);
      const res = await fetch(url);
      const text = await res.text();

      // Response bentuknya: google.visualization.Query.setResponse({...});
      const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
      const data = JSON.parse(jsonText);

      const row = data.table.rows[0]; // K4–S4 satu baris saja

      const result = {};
      FIELD_NAMES.forEach((name, i) => {
        const cell = row.c[i];
        result[name] = cell ? cell.v : '';
      });

      return result;
    }

    function createCard(nodeName, data) {
      const container = document.getElementById('cards-container');

      // Hapus kartu lama jika ada
      let oldCard = document.getElementById(`card-${nodeName}`);
      if (oldCard) oldCard.remove();

      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${nodeName}`;

      // Status pembacaan & pompa
      const statusPembacaan = data['Status Pembacaan'] || '-';
      const statusPompa = data['Status Pompa'] || '-';

      const statusClass = statusPembacaan.toLowerCase().includes('ok') ? 'status-ok' : 'status-error';

      card.innerHTML = `
        <h2>${nodeName.toUpperCase()}</h2>
        <div class="timestamp">
          ${data['Tanggal'] || '-'} ${data['Waktu'] || ''}
        </div>
        <table>
          <tr>
            <th>Status Pembacaan</th>
            <td class="${statusClass}">${statusPembacaan}</td>
          </tr>
          <tr>
            <th>Temperature</th>
            <td>${data['Temperature (°C)'] || '-'} </td>
          </tr>
          <tr>
            <th>Humidity</th>
            <td>${data['Humidity (%)'] || '-'} </td>
          </tr>
          <tr>
            <th>Tekanan Udara</th>
            <td>${data['Tekanan Udara'] || '-'} </td>
          </tr>
          <tr>
            <th>Intensitas Cahaya</th>
            <td>${data['Intensitas Cahaya'] || '-'} </td>
          </tr>
          <tr>
            <th>Kelembaban Tanah</th>
            <td>${data['Kelembaban Tanah'] || '-'} </td>
          </tr>
          <tr>
            <th>Status Pompa</th>
            <td>${statusPompa}</td>
          </tr>
        </table>
      `;

      container.appendChild(card);
    }

    async function loadAllNodes() {
      for (const node of NODES) {
        try {
          const data = await fetchNodeData(node);
          createCard(node, data);
        } catch (err) {
          console.error(`Gagal mengambil data ${node}`, err);
        }
      }
    }

    // Load pertama kali
    loadAllNodes();

    // Auto refresh setiap 30 detik
    setInterval(loadAllNodes, 30000);
  </script>
</body>
</html>
